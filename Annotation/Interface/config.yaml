annotation_task_name: "Turkish-English Sarcasm Annotation"

# Dataset
task_dir: .

data_files:
  - ../../Dataset/pilot_data.csv

item_properties:
  id_key: id
  text_key: reply

# Annotation output
output_annotation_dir: annotation_output

# Display the Parent Comment and Reply separately
instance_display:
  layout:
    direction: vertical
    gap: "20px"

  fields:
    - key: parent_comment
      type: text
      label: "Parent Comment"

    - key: reply
      type: text
      label: "Reply"

# Annotation questions
annotation_schemes:

  # Main sarcasm classification
  - annotation_type: radio
    name: sarcasm_label
    description: "How should this reply be classified?"
    labels:
      - "Sarcastic"
      - "Non-sarcastic"
      - "Ambiguous / Uncertain"
    label_requirement:
      required: true

  # Display only when Ambiguous / Uncertain is selected
  - annotation_type: radio
    name: ambiguity_reason
    description: "Why is the reply ambiguous or uncertain?"
    labels:
      - "Insufficient conversational context"
      - "Drama/character context needed"
      - "Language/expression unclear"
      - "Tone genuinely ambiguous"
      - "Other"
    label_requirement:
      required: true
    display_logic:
      show_when:
        - schema: sarcasm_label
          operator: equals
          value: "Ambiguous / Uncertain"

  # Display only when Other is selected
  - annotation_type: text
    name: other_reason
    description: "Please briefly describe the reason:"
    label_requirement:
      required: true
    display_logic:
      show_when:
        - schema: ambiguity_reason
          operator: equals
          value: "Other"

# Instructions displayed to annotators
annotation_instructions: |
  ## Annotation Instructions

  Read both the **Parent Comment** and the **Reply** before making your decision.

  Classify the reply as:

  - **Sarcastic**
  - **Non-sarcastic**
  - **Ambiguous / Uncertain**

  If you select **Ambiguous / Uncertain**, identify the main reason for your uncertainty:

  - **Insufficient conversational context**
  - **Drama/character context needed**
  - **Language/expression unclear**
  - **Tone genuinely ambiguous**
  - **Other**

  Select the **one main reason** that most strongly affects your decision.

  If you select **Other**, briefly explain the reason in the text box provided.

  Base your decision only on the information provided in the Parent Comment and Reply.

  **Do not search online for additional context.**

# User access
user_config:
  allow_all_users: true
